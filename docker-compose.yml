# Local stack: docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: startupiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-startupiq}
      POSTGRES_DB: startupiq
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startupiq"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      SIQ_DATABASE_URL: postgresql+psycopg://startupiq:${POSTGRES_PASSWORD:-startupiq}@db:5432/startupiq
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
