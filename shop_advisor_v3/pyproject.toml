[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "startupiq"
version = "0.1.0"
description = "Startup IQ: a business checkup for small sellers (forecast, market, rivals, rules, planning)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "scikit-learn>=1.4",
    "lightgbm>=4",
    "statsmodels>=0.14",
    "networkx>=3",
    "pyyaml>=6",
    "pydantic>=2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dl = ["torch>=2.2"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
