# What intake must do with each file in files/ (generated by make_pack.py; all data SYNTHETIC).
# tier: required. roles: subset of column_map that must match. ask: exact needs_confirmation list.
# layout / granularity / sheet: checked when given. message: substring that must appear in a user message.
# log: substring that must appear in the cleaning log.

