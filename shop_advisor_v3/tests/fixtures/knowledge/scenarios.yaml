# Task 1 validation: 8 SYNTHETIC businesses with proposed moves. 4 are consistent, 4 each break
# one constraint on purpose. expect_violations lists the constraint names the checker must report
# (exactly these, no more).

valid_healthy_cafe:
  business: {cash: 300000, monthly_fixed_costs: 80000, gross_margin: 0.45, weekly_sales: 60000, stock_value: 150000, supplier_lead_time_weeks: 1}
  category: food
  rivals: {cafe_bliss: food}
  moves: [promotion, channel_expansion, loyalty_offer]
  expect_violations: []

valid_lean_reseller:
  business: {cash: 50000, monthly_fixed_costs: 20000, gross_margin: 0.25, weekly_sales: 15000, stock_value: 30000, supplier_lead_time_weeks: 2}
